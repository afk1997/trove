[project]
name = "trove"
version = "0.1.0"
description = "A small media downloader + transcript editor."
requires-python = ">=3.11"

# Runtime deps. Diarization (resemblyzer / silero-vad / scikit-learn)
# is now a core dep — speaker labelling is on by default and we don't
# want users to have to remember a separate install step. The CUDA
# wheels torch pulls in transitively are heavy (~1.3GB) but the install
# is one-shot per environment.
dependencies = [
    "flask>=3.0",
    "yt-dlp",
    "pywhispercpp>=1.2.0",
    "psutil>=5.9",
    "resemblyzer>=0.1.4",
    "silero-vad>=5.1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# MCP server is optional — only needed if the user wants to expose
# Trove to a coding agent (Claude Desktop / Cursor / Replit Agent).
# The CLI itself is stdlib-only.
mcp = ["mcp>=1.0.0"]

[project.scripts]
# `trove` — CLI client over the JSON v1 API. Stdlib only.
# `trove-mcp` — MCP (Model Context Protocol) server over stdio.
# Both expect a Trove HTTP server reachable at $TROVE_URL
# (default http://127.0.0.1:5000); start it with `trove serve`.
trove = "cli:main"
trove-mcp = "mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
