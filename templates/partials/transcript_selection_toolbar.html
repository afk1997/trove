{# Floating selection toolbar — JS positions/shows on selectionchange. #}
<div class="t-selection-toolbar" id="t-selection-toolbar"
     role="toolbar" aria-label="selection actions" hidden>
  <button type="button" data-act="copy" title="copy">copy</button>
  <button type="button" data-act="highlight" title="highlight">hi-lite</button>
  <button type="button" data-act="bookmark" title="bookmark">★ mark</button>
  <button type="button" data-act="note" title="add note">¶ note</button>
  <button type="button" data-act="export-selection" title="export selection">⬇ .txt</button>
</div>
