{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl px-5 pt-16 pb-24 sm:pt-24">
  <header class="text-center mb-14 sm:mb-16">
    <h1 class="wordmark">TROVE</h1>
    <p class="tagline mt-3">Save things you care about</p>
  </header>

  <form
    id="fetch-form"
    hx-post="/api/info-card"
    hx-target="#queue"
    hx-swap="afterbegin"
    hx-on::before-request="this.querySelector('[data-fetch-btn]').disabled = true; this.querySelector('[data-fetch-btn]').innerText = 'FETCHING…'"
    hx-on::after-request="this.querySelector('[data-fetch-btn]').disabled = false; this.querySelector('[data-fetch-btn]').innerText = 'FETCH'; this.reset()"
    x-data="{ format: 'video' }"
    class="space-y-3"
  >
    <label class="sr-only" for="urls">Paste a link</label>
    <input
      id="urls"
      name="url"
      type="url"
      placeholder="paste a link"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      required
      class="panel-input"
    >

    <input type="hidden" name="format" :value="format">
    <div class="flex gap-2 items-center">
      <button type="button" class="chip" :data-active="format === 'video'" @click="format = 'video'">MP4</button>
      <button type="button" class="chip" :data-active="format === 'audio'" @click="format = 'audio'">MP3</button>
      <span class="flex-1"></span>
      <button type="submit" class="btn-primary" data-fetch-btn>FETCH</button>
    </div>
  </form>

  <p class="tagline text-center mt-4 opacity-60" style="font-size: 12px; letter-spacing: 0.16em">
    youtube · tiktok · instagram · vimeo · 1000+ more
  </p>

  <div id="queue" aria-live="polite" class="mt-10 space-y-3"></div>
</div>
{% endblock %}
