<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}Trove — Save things you care about{% endblock %}</title>
  <meta name="description" content="Save things you care about. Self-hosted media downloader.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>

  <script nonce="{{ g.csp_nonce }}" src="{{ url_for('static', filename='vendor/htmx.min.js') }}"></script>
  <script nonce="{{ g.csp_nonce }}">
    // Track active downloads so we can sendBeacon a cancel on tab close.
    window.__troveActiveJobs = new Set();
    window.addEventListener('beforeunload', function () {
      for (var id of window.__troveActiveJobs) {
        try { navigator.sendBeacon('/api/job/' + id + '/cancel'); } catch (_) {}
      }
    });
    function refreshActiveJobs() {
      var active = new Set();
      document.querySelectorAll('[data-job-id][data-status="downloading"]').forEach(function (el) {
        active.add(el.dataset.jobId);
      });
      window.__troveActiveJobs = active;
    }
    // Auto-trigger the browser download as soon as a card flips to DONE,
    // so the file lands in ~/Downloads with no second click.
    function autoDownloadDone() {
      document.querySelectorAll('[data-status="done"]:not([data-auto-downloaded])').forEach(function (card) {
        card.setAttribute('data-auto-downloaded', '1');
        var a = card.querySelector('a[href^="/api/file/"]');
        if (a) {
          // The <a download> attribute makes this a save, not a navigation.
          a.click();
        }
      });
    }
    document.addEventListener('htmx:afterSwap', function () {
      refreshActiveJobs();
      autoDownloadDone();
    });
    document.addEventListener('htmx:load', refreshActiveJobs);
  </script>
</body>
</html>
