<?xml version="1.0" encoding="UTF-8"?>
<!-- Walnut wood-grain noise tile. Tints fractalNoise warm brown via feColorMatrix. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="1024" height="256" preserveAspectRatio="none">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <!-- Horizontal-leaning streaks: low frequency on X (long streaks) high on Y (tight bands) -->
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.06" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
      <!-- Slight horizontal smear to make it streaky -->
      <feGaussianBlur in="noise" stdDeviation="0.3 0.0" result="streaks"/>
      <!-- Tint warm walnut: keep red, mute green and blue, add darkening offset -->
      <feColorMatrix in="streaks" type="matrix" values="
        0.55 0 0 0 0.18
        0.30 0 0 0 0.10
        0.12 0 0 0 0.05
        0    0 0 0.55 0.30"/>
      <!-- Boost contrast of the streaks -->
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.1" exponent="0.85" offset="0"/>
        <feFuncG type="gamma" amplitude="1.0" exponent="0.95" offset="0"/>
        <feFuncB type="gamma" amplitude="0.95" exponent="1.0" offset="0"/>
        <feFuncA type="linear" slope="1.4" intercept="-0.15"/>
      </feComponentTransfer>
    </filter>
    <!-- Base walnut color underneath the noise tile -->
    <linearGradient id="walnutBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2818"/>
      <stop offset="0.5" stop-color="#4a2e1a"/>
      <stop offset="1" stop-color="#341e10"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="256" fill="url(#walnutBase)"/>
  <rect width="1024" height="256" filter="url(#grain)" opacity="0.85"/>
</svg>
