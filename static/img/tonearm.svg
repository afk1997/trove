<?xml version="1.0" encoding="UTF-8"?>
<!-- Turntable tonearm. Pivot on the right (~88% x); cartridge head on the left tip. Wrapped in <g id="arm"> for rotation. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="armMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcd9d2"/>
      <stop offset="0.5" stop-color="#c5c2bb"/>
      <stop offset="1" stop-color="#8e8b85"/>
    </linearGradient>
    <linearGradient id="armMetalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8a59f"/>
      <stop offset="1" stop-color="#6a6762"/>
    </linearGradient>
    <radialGradient id="pivotMetal" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e8e5dd"/>
      <stop offset="0.4" stop-color="#c5c2bb"/>
      <stop offset="1" stop-color="#5a5752"/>
    </radialGradient>
    <linearGradient id="cartBlack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2522"/>
      <stop offset="1" stop-color="#0a0807"/>
    </linearGradient>
  </defs>

  <!-- Pivot base (mounted on the deck plinth, right side) -->
  <g id="pivotBase">
    <!-- Outer mount ring -->
    <circle cx="282" cy="100" r="22" fill="url(#pivotMetal)" stroke="#2a2522" stroke-width="0.8"/>
    <circle cx="282" cy="100" r="22" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.35"/>
    <!-- Inner pillar (the rotating bearing housing) -->
    <circle cx="282" cy="100" r="14" fill="url(#armMetalDark)" stroke="#0a0807" stroke-width="0.5"/>
    <circle cx="282" cy="100" r="10" fill="#1a1715" stroke="#3a3530" stroke-width="0.4"/>
    <!-- Counterweight peeking behind the pivot -->
    <ellipse cx="306" cy="100" rx="10" ry="7" fill="#2a2522" stroke="#0a0807" stroke-width="0.4"/>
    <ellipse cx="306" cy="100" rx="10" ry="7" fill="none" stroke="#5a5752" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!--
    Rotating arm group. Resting/parked pose: arm angles slightly upward to the left.
    Transform-origin should be the pivot at (282,100).
    deck.css/JS will rotate this group ~12deg counter-clockwise to drop the stylus.
  -->
  <g id="arm" transform-origin="282 100">
    <!-- Slim metal arm shaft, from pivot out to the cartridge.
         Slight S-curve via two segments for a more authentic "J-arm" feel. -->
    <path d="M 282 100 L 130 92 L 60 88"
          stroke="url(#armMetal)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- Highlight along the top of the arm -->
    <path d="M 282 99 L 130 90.5 L 60 86.5"
          stroke="#ece9e2" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.55"/>
    <!-- Shadow along the bottom of the arm -->
    <path d="M 282 101 L 130 93.5 L 60 89.5"
          stroke="#5a5752" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Bend/joint cap where the arm meets the headshell -->
    <circle cx="60" cy="88" r="3.5" fill="url(#armMetalDark)" stroke="#0a0807" stroke-width="0.4"/>

    <!-- Headshell + cartridge: trapezoid block at the tip -->
    <g transform="translate(60 88)">
      <!-- Headshell (the bracket clamp) -->
      <path d="M 0 -3 L -8 -5 L -22 -3 L -22 5 L -8 7 L 0 3 Z"
            fill="url(#armMetal)" stroke="#2a2522" stroke-width="0.6"/>
      <!-- Cartridge body (black, slightly forward of headshell) -->
      <path d="M -10 -4 L -22 -5 L -28 -1 L -28 4 L -22 6 L -10 5 Z"
            fill="url(#cartBlack)" stroke="#0a0807" stroke-width="0.5"/>
      <!-- Cartridge label dot (the typical brand color insert) -->
      <circle cx="-19" cy="0.5" r="1.4" fill="#ff9a3c" opacity="0.8"/>
      <!-- Stylus needle tip -->
      <line x1="-28" y1="2" x2="-32" y2="6" stroke="#c5c2bb" stroke-width="0.7" stroke-linecap="round"/>
      <circle cx="-32" cy="6" r="0.6" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- Subtle finger-lift tab near the cartridge -->
    <rect x="68" y="78" width="8" height="2.2" rx="1" fill="url(#armMetalDark)" stroke="#0a0807" stroke-width="0.3"/>
  </g>

  <!-- Pivot top cap (drawn last, sits above the arm) -->
  <circle cx="282" cy="100" r="4" fill="#1a1715" stroke="#5a5752" stroke-width="0.4"/>
  <circle cx="281" cy="99" r="1.2" fill="#c5c2bb" opacity="0.7"/>
</svg>
