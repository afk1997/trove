<?xml version="1.0" encoding="UTF-8"?>
<!-- Single tape-reel hub. Six spokes, center pin, one notch marker so rotation is visible. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="reelBody" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f1c1a"/>
      <stop offset="0.7" stop-color="#14110f"/>
      <stop offset="1" stop-color="#0a0807"/>
    </radialGradient>
    <linearGradient id="spokeSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8b85"/>
      <stop offset="0.5" stop-color="#c5c2bb"/>
      <stop offset="1" stop-color="#6a6762"/>
    </linearGradient>
  </defs>

  <!-- Outer ring of the reel hub -->
  <circle cx="32" cy="32" r="30" fill="url(#reelBody)" stroke="#000" stroke-width="0.5"/>
  <!-- Slight outer bevel -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#2a2522" stroke-width="0.6" opacity="0.8"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#0a0807" stroke-width="0.4"/>

  <!-- Six spokes, evenly spaced (60 deg apart). Drawn as tapered slim rectangles around center. -->
  <g fill="url(#spokeSheen)" stroke="#0a0807" stroke-width="0.25">
    <!-- 0 deg (right) - this is the asymmetric notch marker spoke (slightly wider/lighter) -->
    <rect x="32" y="30.5" width="24" height="3" rx="0.6" fill="#d8d4cc"/>
    <!-- 60 -->
    <rect x="32" y="31" width="24" height="2" rx="0.5" transform="rotate(60 32 32)"/>
    <!-- 120 -->
    <rect x="32" y="31" width="24" height="2" rx="0.5" transform="rotate(120 32 32)"/>
    <!-- 180 -->
    <rect x="32" y="31" width="24" height="2" rx="0.5" transform="rotate(180 32 32)"/>
    <!-- 240 -->
    <rect x="32" y="31" width="24" height="2" rx="0.5" transform="rotate(240 32 32)"/>
    <!-- 300 -->
    <rect x="32" y="31" width="24" height="2" rx="0.5" transform="rotate(300 32 32)"/>
  </g>

  <!-- Notch marker: small bright dot on the asymmetric spoke (makes rotation visible) -->
  <circle cx="50" cy="32" r="1.4" fill="#ffd28a" opacity="0.9"/>

  <!-- Inner hub disc -->
  <circle cx="32" cy="32" r="9" fill="#0e0c0a" stroke="#2a2522" stroke-width="0.5"/>
  <!-- Drive pin / center hole -->
  <circle cx="32" cy="32" r="3.2" fill="#020202" stroke="#1a1715" stroke-width="0.3"/>
  <!-- Tiny center highlight -->
  <circle cx="31" cy="31" r="0.7" fill="#3a3530" opacity="0.6"/>
</svg>
