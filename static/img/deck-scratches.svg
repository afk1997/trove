<?xml version="1.0" encoding="UTF-8"?>
<!-- Brushed-aluminum micro-scratches. High Y frequency, blurred horizontally to elongate. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 64" width="1024" height="64" preserveAspectRatio="none">
  <defs>
    <filter id="brushed" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <!-- Tight horizontal lines: low X freq, high Y freq -->
      <feTurbulence type="fractalNoise" baseFrequency="0.4 0.04" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
      <!-- Strong horizontal blur to elongate scratches into streaks -->
      <feGaussianBlur in="noise" stdDeviation="4 0.3" result="streaks"/>
      <!-- Desaturated, near-white-on-near-black for a metallic look. Apply low alpha so it's subtle. -->
      <feColorMatrix in="streaks" type="matrix" values="
        0.7 0.7 0.7 0 0.05
        0.7 0.7 0.7 0 0.05
        0.7 0.7 0.7 0 0.05
        0   0   0   0 0.45"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6" intercept="-0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <!-- Transparent background; only the filtered scratches are visible (so it overlays cleanly) -->
  <rect width="1024" height="64" fill="#000" fill-opacity="0" filter="url(#brushed)"/>
  <rect width="1024" height="64" filter="url(#brushed)"/>
</svg>
